<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a103c"/>
      <stop offset="35%" stop-color="#2d1b69"/>
      <stop offset="70%" stop-color="#5b2d8a"/>
      <stop offset="100%" stop-color="#8e4a9e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <rect width="1080" height="1920" fill="url(#glow1)"/>
  <rect width="1080" height="1920" fill="url(#glow2)"/>
  <rect width="1080" height="1920" fill="url(#glow3)"/>

  <!-- 彩虹弧线 -->
  <path d="M-100 1200 Q540 400 1180 1200" fill="none" stroke="url(#rainbow)" stroke-width="18" opacity="0.15" stroke-linecap="round"/>
  <path d="M-60 1250 Q540 500 1140 1250" fill="none" stroke="url(#rainbow)" stroke-width="14" opacity="0.12" stroke-linecap="round"/>
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3b6e"/>
      <stop offset="20%" stop-color="#ffc940"/>
      <stop offset="40%" stop-color="#3ddc84"/>
      <stop offset="60%" stop-color="#4da6ff"/>
      <stop offset="80%" stop-color="#a06ee0"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
  </defs>

  <!-- 星星 -->
  <g fill="#fff" opacity="0.6">
    <circle cx="150" cy="180" r="2.5"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="260" r="2"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="420" r="3"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="150" r="2"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="520" r="2.5"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="650" r="2"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="80" r="2.5"><animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="800" r="2"><animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="900" r="2"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 气泡 -->
  <g opacity="0.12">
    <circle cx="200" cy="300" r="40" fill="#a78bfa"><animate attributeName="cy" values="300;260;300" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="500" r="60" fill="#4da6ff"><animate attributeName="cy" values="500;440;500" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="700" r="35" fill="#ff6b9d"><animate attributeName="cy" values="700;650;700" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="1100" r="50" fill="#3ddc84"><animate attributeName="cy" values="1100;1020;1100" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="1300" r="45" fill="#ffc940"><animate attributeName="cy" values="1300;1220;1300" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="1500" r="55" fill="#a06ee0"><animate attributeName="cy" values="1500;1420;1500" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="1600" r="30" fill="#2dd4bf"><animate attributeName="cy" values="1600;1550;1600" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 小装饰圆 -->
  <g opacity="0.08">
    <circle cx="150" cy="1500" r="120" fill="#fff"/>
    <circle cx="950" cy="200" r="90" fill="#fff"/>
    <circle cx="600" cy="1700" r="140" fill="#fff"/>
  </g>
</svg>